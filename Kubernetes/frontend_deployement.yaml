apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: dev
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      tier: frontend
  template:
    metadata: 
      labels:
        app: frontend
        tier: frontend    
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers: 
        - name: frontend
          image: sreejitheyne/devsecops:frontend-54a52a9-19
          ports:
            - containerPort: 3000
         
